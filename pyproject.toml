[project]
name = "jwtlint"
version = "0.2.0"
description = "Offline static security analysis for JWTs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baran Ayaztas" }]
keywords = ["jwt", "security", "pentest", "bug-bounty", "appsec", "static-analysis", "jws"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/ReazGan/jwtlint"
Issues = "https://github.com/ReazGan/jwtlint/issues"

[project.scripts]
jwtlint = "jwtlint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jwtlint*"]
